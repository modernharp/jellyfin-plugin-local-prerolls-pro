name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test -c Release

      - name: Build the plugin zip
        run: bash scripts/package.sh 0.0.0

      - name: Upload the zip (for testing a build)
        uses: actions/upload-artifact@v4
        with:
          name: local-prerolls-pro-dev
          path: dist/local-prerolls-pro_*.zip
